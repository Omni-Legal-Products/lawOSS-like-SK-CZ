<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architektúra LAWOSS</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f7f9; --color-ink: #0d1b2a; --color-muted: #42586e;
      --color-soft: #9aa6b8; --color-rule: rgba(13,27,42,0.12);
      --color-accent: #c9a24a; --color-link: #2a6099;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Times New Roman', serif;
      --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; color: var(--color-ink); }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2.5rem; }
    .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 58ch; }
    .diagram-container { background: transparent; border: none; padding: 0; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(13,27,42,0.10); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--color-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <p class="header-eyebrow">Architecture · LAWOSS · 21. 8. 2026</p>
      <h1>Architektúra — návrh</h1>
      <p class="subtitle">Čo je cudzie, čo je naše a čo si volí advokát. LegalWork je základ, ktorý forkujeme; OKF je vrstva, ktorá nás odlišuje; konektory a modely sú voľba používateľa.</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architektura-title architektura-desc">

        <desc id="architektura-desc">Vrstvy projektu: advokát pracuje v našej vrstve nad forkom LegalWorku, ktorá stojí na OKF, slovenských a českých skills a otvorenom prompt layeri, a napája sa na právne konektory a na modely podľa voľby používateľa.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#42586e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a24a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a6099"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f6f7f9"/>

        <!-- ══ ZONES ══ -->
        <rect x="344" y="72" width="352" height="104" rx="8" fill="rgba(13,27,42,0.02)" stroke="rgba(13,27,42,0.10)" stroke-width="0.8"/>
        <rect x="452" y="76" width="136" height="12" rx="2" fill="#f6f7f9"/>
        <text x="520" y="85" fill="rgba(13,27,42,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ZÁKLAD · MIT</text>

        <rect x="48" y="232" width="904" height="136" rx="8" fill="rgba(13,27,42,0.02)" stroke="rgba(13,27,42,0.10)" stroke-width="0.8"/>
        <rect x="228" y="236" width="144" height="12" rx="2" fill="#f6f7f9"/>
        <text x="300" y="245" fill="rgba(13,27,42,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NÁŠ PROJEKT</text>

        <!-- ══ ARROWS ══ -->
        <line x1="136" y1="152" x2="136" y2="264" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="500" y1="168" x2="500" y2="264" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="510" y="204" width="36" height="12" rx="2" fill="#f6f7f9"/>
        <text x="528" y="213" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORK</text>

        <line x1="220" y1="336" x2="220" y2="440" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="230" y="382" width="72" height="12" rx="2" fill="#f6f7f9"/>
        <text x="266" y="391" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KONEKTORY</text>

        <line x1="780" y1="336" x2="780" y2="440" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="790" y="382" width="88" height="12" rx="2" fill="#f6f7f9"/>
        <text x="834" y="391" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOĽBA MODELU</text>

        <!-- ══ NODES ══ -->

        <!-- Advokát -->
        <rect x="48" y="88" width="176" height="64" rx="20" fill="#f6f7f9"/>
        <rect x="48" y="88" width="176" height="64" rx="20" fill="rgba(66,88,110,0.10)" stroke="#9aa6b8" stroke-width="1"/>
        <text x="136" y="116" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advokát</text>
        <text x="136" y="132" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SK · CZ</text>

        <!-- LegalWork -->
        <rect x="368" y="104" width="304" height="64" rx="6" fill="#f6f7f9"/>
        <rect x="368" y="104" width="304" height="64" rx="6" fill="rgba(13,27,42,0.03)" stroke="rgba(13,27,42,0.30)" stroke-width="1"/>
        <text x="520" y="132" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LegalWork</text>
        <text x="520" y="148" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nad opencode harnessom · upstream</text>

        <!-- OKF · FOCAL -->
        <rect x="80" y="264" width="280" height="72" rx="6" fill="#f6f7f9"/>
        <rect x="80" y="264" width="280" height="72" rx="6" fill="rgba(201,162,74,0.12)" stroke="#c9a24a" stroke-width="1"/>
        <rect x="88" y="270" width="76" height="12" rx="2" fill="transparent" stroke="rgba(201,162,74,0.40)" stroke-width="0.8"/>
        <text x="126" y="279" fill="rgba(201,162,74,0.95)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JADRO ODLÍŠENIA</text>
        <text x="220" y="302" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OKF — organizácia praxe</text>
        <text x="220" y="320" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spisy · riadiace súbory · poriadok</text>

        <!-- SK/CZ skills -->
        <rect x="392" y="264" width="216" height="72" rx="6" fill="#f6f7f9"/>
        <rect x="392" y="264" width="216" height="72" rx="6" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="500" y="296" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SK a CZ skills</text>
        <text x="500" y="314" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">šablóny · lokalizácia</text>

        <!-- Prompt layer -->
        <rect x="640" y="264" width="280" height="72" rx="6" fill="#f6f7f9"/>
        <rect x="640" y="264" width="280" height="72" rx="6" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="780" y="296" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Otvorený prompt layer</text>
        <text x="780" y="314" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">žiadny black box · verzované</text>

        <!-- MCP konektory -->
        <rect x="80" y="440" width="360" height="80" rx="6" fill="#f6f7f9"/>
        <rect x="80" y="440" width="360" height="80" rx="6" fill="rgba(13,27,42,0.03)" stroke="rgba(13,27,42,0.30)" stroke-width="1"/>
        <rect x="88" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,27,42,0.28)" stroke-width="0.8"/>
        <text x="102" y="455" fill="rgba(13,27,42,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="260" y="480" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Právne konektory</text>
        <text x="260" y="496" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Slov-Lex · ORSR / RPO · RPVS</text>
        <text x="260" y="510" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">judikatúra · OV · FS · ÚVO</text>

        <!-- Modely -->
        <rect x="560" y="440" width="360" height="80" rx="6" fill="#f6f7f9"/>
        <rect x="560" y="440" width="360" height="80" rx="6" fill="rgba(13,27,42,0.03)" stroke="rgba(13,27,42,0.30)" stroke-width="1"/>
        <rect x="568" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(13,27,42,0.28)" stroke-width="0.8"/>
        <text x="582" y="455" fill="rgba(13,27,42,0.55)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BYO</text>
        <text x="740" y="480" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modely — volí používateľ</text>
        <text x="740" y="496" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">predplatné · vlastný API kľúč</text>
        <text x="740" y="510" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lokálny model pre dôverné dáta</text>

        <!-- ══ LEGEND ══ -->
        <line x1="48" y1="568" x2="952" y2="568" stroke="rgba(13,27,42,0.10)" stroke-width="0.8"/>
        <text x="48" y="592" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

        <rect x="136" y="582" width="10" height="10" rx="2" fill="rgba(201,162,74,0.12)" stroke="#c9a24a" stroke-width="1"/>
        <text x="152" y="592" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">jadro odlíšenia</text>

        <rect x="312" y="582" width="10" height="10" rx="2" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="328" y="592" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">naša vrstva</text>

        <rect x="464" y="582" width="10" height="10" rx="2" fill="rgba(13,27,42,0.03)" stroke="rgba(13,27,42,0.30)" stroke-width="1"/>
        <text x="480" y="592" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">cudzie / voľba používateľa</text>

        <rect x="720" y="582" width="10" height="10" rx="5" fill="rgba(66,88,110,0.10)" stroke="#9aa6b8" stroke-width="1"/>
        <text x="736" y="592" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">používateľ</text>
      </svg>
    </div>

    <div class="footer">
      <span>LAWOSS · ADR 0003 · ADR 0004</span>
      <span>nahrádza mermaid diagram v README</span>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ako pracujeme s rozhodnutiami</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f7f9; --color-ink: #0d1b2a; --color-muted: #42586e;
      --color-soft: #9aa6b8; --color-rule: rgba(13,27,42,0.12);
      --color-accent: #c9a24a; --color-link: #2a6099;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Times New Roman', serif;
      --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; color: var(--color-ink); }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2.5rem; }
    .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.5rem; }
    .subtitle { font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 58ch; }
    .diagram-container { background: transparent; border: none; padding: 0; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(13,27,42,0.10); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--color-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <p class="header-eyebrow">Flowchart · LAWOSS · 21. 8. 2026</p>
      <h1>Ako pracujeme s rozhodnutiami</h1>
      <p class="subtitle">Nápad sa nestane kódom, kým neprejde rozpravou. Ak nie je zhoda, ide sa preveriť a vrátiť — tá slučka je najdôležitejšia časť postupu.</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tok-rozhodnutia-title tok-rozhodnutia-desc">
        <title id="tok-rozhodnutia-title">Ako pracujeme s rozhodnutiami</title>
        <desc id="tok-rozhodnutia-desc">Postup od nápadu cez spoločnú rozpravu štyroch členov tímu k ADR alebo špecifikácii, backlogu a implementácii vo forku; pri nezhode sa vec vracia na rešerš a späť do rozpravy.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#42586e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9a24a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a6099"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f6f7f9"/>

        <!-- ══ ARROWS ══ -->
        <!-- Nápad → Diskusia (horná ľavá hrana) -->
        <line x1="196" y1="184" x2="280" y2="184" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Diskusia → ADR/spec -->
        <line x1="400" y1="200" x2="460" y2="200" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="408" y="180" width="44" height="12" rx="2" fill="#f6f7f9"/>
        <text x="430" y="189" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZHODA</text>

        <!-- Diskusia → Rešerš -->
        <line x1="328" y1="256" x2="328" y2="344" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="338" y="292" width="92" height="12" rx="2" fill="#f6f7f9"/>
        <text x="384" y="301" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TREBA PREVERIŤ</text>

        <!-- Rešerš → späť do Diskusie (dolná ľavá hrana) -->
        <path d="M 248,376 H 216 Q 208,376 208,368 V 224 Q 208,216 216,216 H 280"
              fill="none" stroke="#42586e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ADR/spec → Backlog -->
        <line x1="620" y1="200" x2="652" y2="200" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Backlog → Implementácia -->
        <line x1="812" y1="200" x2="844" y2="200" stroke="#42586e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ══ NODES ══ -->

        <!-- Nápad (oval, start) -->
        <rect x="36" y="168" width="160" height="64" rx="20" fill="#f6f7f9"/>
        <rect x="36" y="168" width="160" height="64" rx="20" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="116" y="196" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nápad</text>
        <text x="116" y="212" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Telegram · issue</text>

        <!-- Diskusia (diamond, FOCAL) -->
        <polygon points="328,144 400,200 328,256 256,200" fill="#f6f7f9"/>
        <polygon points="328,144 400,200 328,256 256,200" fill="rgba(201,162,74,0.12)" stroke="#c9a24a" stroke-width="1.2"/>
        <text x="328" y="196" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rozprava</text>
        <text x="328" y="212" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MČ · MF · IR · VŘ</text>

        <!-- Rešerš -->
        <rect x="248" y="344" width="160" height="64" rx="6" fill="#f6f7f9"/>
        <rect x="248" y="344" width="160" height="64" rx="6" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="328" y="372" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rešerš</text>
        <text x="328" y="388" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">research/</text>

        <!-- ADR alebo spec -->
        <rect x="460" y="168" width="160" height="64" rx="6" fill="#f6f7f9"/>
        <rect x="460" y="168" width="160" height="64" rx="6" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="540" y="196" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ADR alebo spec</text>
        <text x="540" y="212" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decisions/ · specs/</text>

        <!-- Backlog / issue -->
        <rect x="652" y="168" width="160" height="64" rx="6" fill="#f6f7f9"/>
        <rect x="652" y="168" width="160" height="64" rx="6" fill="rgba(13,27,42,0.05)" stroke="#42586e" stroke-width="1"/>
        <text x="732" y="196" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backlog a issue</text>
        <text x="732" y="212" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">planning/</text>

        <!-- Implementácia (oval, end) -->
        <rect x="844" y="168" width="140" height="64" rx="20" fill="#f6f7f9"/>
        <rect x="844" y="168" width="140" height="64" rx="20" fill="rgba(13,27,42,0.05)" stroke="#42586e" stroke-width="1"/>
        <text x="914" y="196" fill="#0d1b2a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implementácia</text>
        <text x="914" y="212" fill="#42586e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vo forku</text>

        <!-- ══ LEGEND ══ -->
        <line x1="36" y1="456" x2="964" y2="456" stroke="rgba(13,27,42,0.10)" stroke-width="0.8"/>
        <text x="36" y="480" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

        <rect x="128" y="470" width="18" height="10" rx="5" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="156" y="480" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">začiatok / koniec</text>

        <rect x="332" y="470" width="18" height="10" rx="2" fill="#ffffff" stroke="#0d1b2a" stroke-width="1"/>
        <text x="360" y="480" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">krok</text>

        <polygon points="484,470 496,475 484,480 472,475" fill="rgba(201,162,74,0.12)" stroke="#c9a24a" stroke-width="1"/>
        <text x="508" y="480" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">rozhodnutie tímu</text>

        <line x1="700" y1="475" x2="724" y2="475" stroke="#42586e" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="732" y="480" fill="#42586e" font-size="8" font-family="'Geist Mono', monospace">návrat na rozpravu</text>
      </svg>
    </div>

    <div class="footer">
      <span>LAWOSS · pravidlá v AGENTS.md</span>
      <span>nahrádza mermaid diagram v README</span>
    </div>

  </div>
</body>
</html>

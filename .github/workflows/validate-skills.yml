name: Validácia skillov

on:
  pull_request:
    paths:
      - "plugins/**"
      - "skills/**"

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Spusti validátor skillov
        run: node scripts/validate-skills.mjs

name: Auto-update README

on:
  push:
    branches: [main]
  workflow_dispatch:

# Behy sa nesmú prekrývať: pri viacerých pushoch krátko po sebe si dva behy
# navzájom pretečú a ten pomalší spadne na non-fast-forward.
concurrency:
  group: auto-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # zabráni nekonečnej slučke, keď workflow sám pushne
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate README auto sections
        run: python3 .github/scripts/update_readme.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet README.md; then
            echo "README bez zmien."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto-update README [skip ci]"
          # main sa mohol medzitým pohnúť (merge, ďalší push) — dorovnaj a skús znova
          for pokus in 1 2 3; do
            if git push; then
              echo "Pushnuté na $pokus. pokus."
              exit 0
            fi
            echo "Push odmietnutý, dorovnávam main a skúšam znova…"
            git pull --rebase --autostash origin main
          done
          echo "::warning::README sa nepodarilo pushnúť ani na tretí pokus. Ďalší push do main to vygeneruje znova."
          exit 0

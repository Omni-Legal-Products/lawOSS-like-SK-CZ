name: 💡 Návrh funkcie
description: Navrhni funkciu do MikeOSS Slovakia (netreba nič programovať)
title: "[Návrh]: "
labels: ["návrh funkcie"]
body:
  - type: markdown
    attributes:
      value: |
        Vyplň, čo vieš — nič nie je povinné okrem prvých dvoch polí.
        Po prerokovaní to prepíšeme do `specs/` a zapíšeme do [evidencie návrhov](../blob/main/specs/navrhy.md).

  - type: input
    id: navrhol
    attributes:
      label: Kto navrhuje
      description: Meno alebo skratka (MČ / MF / IR)
      placeholder: napr. Martin Friedrich
    validations:
      required: true

  - type: textarea
    id: co
    attributes:
      label: Čo by mal nástroj vedieť
      description: Popíš to normálnou rečou, technicky to netreba
      placeholder: |
        napr. „Keď mi príde uznesenie súdu, nech mi automaticky vytiahne lehotu
        a zapíše ju do spisu, aby mi neušla."
    validations:
      required: true

  - type: textarea
    id: preco
    attributes:
      label: Aký problém to rieši
      description: Čo ťa dnes zdržuje alebo štve? Koľko času by to ušetrilo?
      placeholder: napr. „Lehoty si prepisujem ručne do kalendára, občas niečo prehliadnem."

  - type: dropdown
    id: priorita
    attributes:
      label: Ako veľmi to treba
      options:
        - "Nice to have — pokojne neskôr"
        - "Užitočné — chcel by som to v dohľadnej dobe"
        - "Kritické — bez toho to nemá zmysel používať"

  - type: dropdown
    id: citlive
    attributes:
      label: Pracuje to s dôvernými klientskymi údajmi?
      description: Dôležité kvôli mlčanlivosti — určí, či to môže ísť do cloudu alebo musí bežať lokálne
      options:
        - "Áno — obsahuje údaje klienta / spisu"
        - "Nie — je to všeobecná/abstraktná úloha"
        - "Neviem posúdiť"

  - type: textarea
    id: kontrola_pouzivatela
    attributes:
      label: Kontrola používateľa
      description: Ako bude mať právnik kontrolu nad modelmi, dátami, nástrojmi a know-how pri tejto funkcii?
      placeholder: Napríklad výber modelu, vlastný zdroj dát, možnosť overiť použitý nástroj alebo upraviť workflow.

  - type: textarea
    id: otvorenost_a_prenositelnost
    attributes:
      label: Otvorenosť a prenositeľnosť
      description: Dá sa riešenie pochopiť, upraviť, vymeniť alebo opustiť? Uveď, čo bude prenositeľné medzi konfiguráciami.
      placeholder: Napríklad otvorený skill, vymeniteľný MCP server alebo exportovateľný workflow.

  - type: textarea
    id: riadenie_agentov
    attributes:
      label: Riadenie agentov a schválenie
      description: Čo môže agent vykonať, aké riziko nesie a kde právnik schvaľuje alebo kontroluje výsledok?
      placeholder: Napríklad agent pripraví návrh, ale právnik pred odoslaním preverí zdroje a výsledok schváli.

  - type: textarea
    id: vynimka_z_doktriny
    attributes:
      label: Možná výnimka z produktovej doktríny
      description: Obmedzuje návrh kontrolu, otvorenosť, audit alebo primerané schválenie? Ak áno, vysvetli dôvod, mitigáciu a časové obmedzenie pre samostatný ADR.
      placeholder: Ak výnimka nie je potrebná, uveď prečo.

  - type: textarea
    id: poznamky
    attributes:
      label: Čokoľvek ďalšie
      description: Príklad, screenshot, odkaz na nástroj, ktorý to už vie…
